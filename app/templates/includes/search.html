<dialog id="search-dialog" aria-labelledby="search-title">
  <div class="search-bar">
    <label class="sr-only" id="search-title" for="search-input">Search CoreTrail</label
    ><input
      id="search-input"
      type="search"
      placeholder="Search topics, patterns, or code…"
      autocomplete="off"

    ><button id="search-close" aria-label="Close search">Esc</button>
  </div>
  <div id="search-results" aria-live="polite">
    <p class="search-message">Type a concept, keyword, or function.</p>
  </div>
  <div class="search-footer">
    Search across lessons and examples <span>Enter to open · Esc to close</span>
  </div>
</dialog>
