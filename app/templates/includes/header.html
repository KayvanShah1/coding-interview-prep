{% if include.variant == 'home' %}
  <header class="home-header">
    <div class="home-container">
      {% include brand.html class="home-brand" %}
      <nav aria-label="Main navigation">
        <a href="{{ '/sql/' | relative_url }}">SQL</a>
        <a href="{{ '/' | relative_url }}#subjects">Subjects</a>
        <a
          class="icon-button"
          href="https://github.com/{{ site.repository }}"
          aria-label="GitHub repository"
          title="GitHub repository"
        >
          {%- include icons/github.html -%}
        </a>
        {% include theme-toggle.html %}
      </nav>
    </div>
  </header>
{% else %}
  <header class="mobile-header">
    <button
      id="nav-toggle"
      aria-label="Open navigation"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      ☰
    </button>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="header-actions">
      <button class="search-open" aria-label="Search">Search</button>
      {% include theme-toggle.html %}
    </div>
  </header>
{% endif %}
