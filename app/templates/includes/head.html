<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<title>
  {{ page.title | escape }}
  ·
  {{ site.title }}
</title>
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<script src="{{ '/assets/js/main.js' | relative_url }}" type="module"></script>
{% if page.mermaid %}
  <script src="{{ '/assets/js/diagrams.js' | relative_url }}" type="module"></script>
{% endif %}
