title: CoreTrail
description: A practical interview handbook for data, AI, machine learning, software engineering, and related technical topics.
url: https://kayvanshah1.github.io
baseurl: /coretrail
repository: KayvanShah1/coretrail
source: app
destination: _site
collections_dir: subjects
layouts_dir: templates/layouts
includes_dir: templates/includes
markdown: kramdown
highlighter: rouge
sass:
  style: compressed
  sourcemap: never
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  sql:
    output: true
    permalink: /sql/:path/
  ai:
    output: true
    permalink: /ai-engineering/:path/
  infra:
    output: true
    permalink: /infrastructure/:path/
defaults:
  - scope:
      path: ''
      type: sql
    values:
      layout: lesson
      subject: sql
  - scope:
      path: ''
      type: ai
    values:
      layout: lesson
      subject: ai-engineering
  - scope:
      path: ''
      type: infra
    values:
      layout: lesson
      subject: infrastructure
exclude:
  - templates
